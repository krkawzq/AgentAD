[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentad"]

[project]
name = "agentad"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0,<3",
    "pandas>=2.2,<3",
    "pyarrow>=25.0.1",
    "zarr>=3.3.0",
]

[project.optional-dependencies]
download = [
    "gdown>=5.2,<6",
    "requests>=2.32,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
pythonpath = ["src", "."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentad"]

[project]
name = "agentad"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
license-files = [
    "forks/TSB-AD/LICENSE",
    "THIRD_PARTY_NOTICES.md",
]
requires-python = ">=3.12"
dependencies = [
    "numba>=0.67,<1",
    "numpy>=2.5.2,<3",
    "pandas>=3.0.5,<4",
    "pyarrow>=25.0.1,<26",
    "scipy>=1.18.1,<2",
    "statsmodels>=0.15.0,<1",
    "zarr>=3.3.0",
]

[project.optional-dependencies]
download = [
    "gdown",
    "requests",
]
# 深度学习方法的通用训练栈
methods = [
    "lightning>=2.6.5,<3",
    "torch>=2.11,<3",
]
# 单算法私有依赖，按需安装：uv sync --extra methods --extra xlstmad --extra tspulse
xlstmad = [
    "xlstm==2.0.5",
]
tspulse = [
    "granite-tsfm>=0.3.8",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "scikit-learn>=1.7,<1.8",
]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
pythonpath = ["src", "."]

[tool.mypy]
python_version = "3.12"
# SQLite 缓存在共享存储上不可用（磁盘 I/O 错误），指向本机临时目录。
cache_dir = "/tmp/agentad-mypy-cache"
namespace_packages = true
explicit_package_bases = true
mypy_path = ["src", "scripts/preprocess"]
python_executable = ".venv/bin/python"
files = ["src/agentad", "scripts"]

# 无 py.typed 标记或按需安装（extras）的第三方依赖。
[[tool.mypy.overrides]]
module = [
    "gdown.*",
    "numba.*",
    "pandas.*",
    "pyarrow.*",
    "scipy.*",
    "sklearn.*",
    "statsmodels.*",
    "tsfm_public.*",
    "xlstm.*",
]
ignore_missing_imports = true

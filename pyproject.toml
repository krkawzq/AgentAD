[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentad"]

[project]
name = "agentad"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
license-files = [
    "forks/TSB-AD/LICENSE",
    "THIRD_PARTY_NOTICES.md",
]
requires-python = ">=3.12"
dependencies = [
    "numba>=0.61,<1",
    "numpy>=2.0,<3",
    "pandas>=2.2,<3",
    "pyarrow>=25.0.1",
    "scipy>=1.18.1",
    "statsmodels>=0.15.0",
    "torch>=2.13.0",
    "zarr>=3.3.0",
]

[project.optional-dependencies]
download = [
    "gdown>=5.2,<6",
    "requests>=2.32,<3",
]

# torch 使用官方 PyTorch 源提供的 CUDA 13.0 (cu130) wheel
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "scikit-learn>=1.9.0",
]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
pythonpath = ["src", "."]
